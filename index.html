
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background-color: #ffd6e8;
}

/* ---------- FLOATING BACKGROUND HEARTS ---------- */
.bg-heart {
    position: absolute;
    font-size: 80px;
    color: rgba(255, 77, 109, 0.5);
    pointer-events: none;
    animation: drift linear infinite;
}

@keyframes drift {
    from { transform: translate(0px, 0px) rotate(0deg);}
    to { transform: translate(200px, 200px) rotate(360deg);}
}

/* ---------- FIRST SCREEN ---------- */
.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    color: #d63384;
    font-size: 42px;
    margin-bottom: 60px;
}

.buttons {
    position: relative;
    width: 420px;
    height: 120px;
}

button {
    padding: 15px 40px;
    font-size: 22px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
}

#yes {
    right: 0;
    background: #ff4d6d;
    color: white;
}

#no {
    left: 0;
    background: #adb5bd;
}

/* ---------- LOVE SCREEN ---------- */
.love-screen {
    display: none;
    position: relative;
    height: 100vh;
    justify-content: center;
    align-items: center;
}

.love-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.big-heart {
    font-size: 750px; /* doubled in size */
    color: rgba(255, 77, 109, 0.35);
    position: absolute;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    line-height: 0.8;
}

.love-text {
    font-size: 70px;
    font-weight: bold;
    color: #d63384;
    z-index: 2;
    max-width: 400px;
}

/* ---------- ROSES BACKGROUND ---------- */
.roses {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.rose {
    position: absolute;
    font-size: 100px;
    opacity: 0.3;
}

/* ---------- RAINING HEARTS ---------- */
.rain-heart {
    position: absolute;
    top: -50px;
    font-size: 35px;
    animation: fall 5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND HEARTS -->
<div id="bg-hearts"></div>

<!-- FIRST SCREEN -->
<div class="container" id="start">
    <h1>Will you be my Valentine?</h1>
    <div class="buttons">
        <button id="no" onmouseover="moveNo()" onclick="moveNo()">NO</button>
        <button id="yes" onclick="showLove()">YES</button>
    </div>
</div>

<!-- SECOND SCREEN -->
<div class="love-screen" id="love">
    <div class="roses" id="roses"></div>
    <div class="love-wrapper">
        <div class="big-heart">❤️</div>
        <div class="love-text">I LOVE YOU</div>
    </div>
</div>

<script>
/* ---------- CREATE RANDOM FLOATING HEARTS ---------- */
const numHearts = 15;
const bgHearts = document.getElementById("bg-hearts");

for(let i=0;i<numHearts;i++){
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = Math.random() * window.innerHeight + "px";
    heart.style.fontSize = 80 + Math.random() * 80 + "px";
    const duration = 30 + Math.random() * 50;
    heart.style.animationDuration = duration + "s";
    bgHearts.appendChild(heart);
}

/* ---------- MOVE NO BUTTON SLIGHTLY WITHOUT LEAVING SCREEN ---------- */
function moveNo() {
    const no = document.getElementById("no");
    const btnWidth = no.offsetWidth;
    const btnHeight = no.offsetHeight;
    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight;

    // Get current position
    let currentX = parseFloat(no.style.left) || 0;
    let currentY = parseFloat(no.style.top) || 0;

    // Move a small random distance (-50 to 50)
    let dx = (Math.random() - 0.5) * 150; 
    let dy = (Math.random() - 0.5) * 150;

    let newX = currentX + dx;
    let newY = currentY + dy;

    // Clamp to screen edges
    if (newX < 0) newX = 0;
    if (newX > maxX) newX = maxX;
    if (newY < 0) newY = 0;
    if (newY > maxY) newY = maxY;

    no.style.left = newX + "px";
    no.style.top = newY + "px";
}

/* ---------- SHOW LOVE SCREEN ---------- */
function showLove(){
    document.getElementById("start").style.display = "none";
    document.getElementById("bg-hearts").style.display = "none";

    const love = document.getElementById("love");
    love.style.display = "flex";

    // Add roses with random velocity
    const rosesArray = [];
    for(let i=0;i<10;i++){
        const r = document.createElement("div");
        r.className = "rose";
        r.innerHTML = "🌹";
        r.style.left = Math.random() * window.innerWidth + "px";
        r.style.top = Math.random() * window.innerHeight + "px";

        r.vx = (Math.random() - 0.5) * 0.3; // horizontal speed
        r.vy = (Math.random() - 0.5) * 0.3; // vertical speed

        document.getElementById("roses").appendChild(r);
        rosesArray.push(r);
    }

    // Animate roses
    function animateRoses(){
        rosesArray.forEach(r => {
            let x = parseFloat(r.style.left);
            let y = parseFloat(r.style.top);

            x += r.vx;
            y += r.vy;

            // Wrap around screen edges
            if (x > window.innerWidth) x = -50;
            if (x < -50) x = window.innerWidth;
            if (y > window.innerHeight) y = -50;
            if (y < -50) y = window.innerHeight;

            r.style.left = x + "px";
            r.style.top = y + "px";
        });
        requestAnimationFrame(animateRoses);
    }

    animateRoses();

    // Raining hearts
    setInterval(()=>{
        const h = document.createElement("div");
        h.className = "rain-heart";
        h.innerHTML = "❤️";
        h.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(h);
        setTimeout(()=> h.remove(), 5000);
    },180);
}
</script>

</body>
</html>
