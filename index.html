<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background-color: #ffd6e8;
}

/* ---------- FLOATING BACKGROUND HEARTS ---------- */
.bg-heart {
    position: absolute;
    font-size: 80px;
    color: rgba(255, 77, 109, 0.5);
    pointer-events: none;
    animation: drift linear infinite;
}

@keyframes drift {
    from { transform: translate(0px, 0px) rotate(0deg);}
    to { transform: translate(200px, 200px) rotate(360deg);}
}

/* ---------- FIRST SCREEN ---------- */
.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
